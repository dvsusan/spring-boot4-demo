name: build

# 每次推送和 Pull Request 都执行同一套构建命令。
on:
  push:
  pull_request:

jobs:
  test:
    # 使用干净的 Ubuntu 环境，避免依赖开发者的本机缓存。
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: mvn -B clean verify
