demo:
  chapter7:
    enabled: true
    async:
      # 模拟下游聚合超过该时间就返回降级结果。
      timeout: 500ms
    ai:
      # 没有模型密钥时使用确定性的演示实现，仍可验证 RAG 编排。
      remote-enabled: ${DEMO_AI_REMOTE_ENABLED:false}
      model: ${DEMO_AI_MODEL:qwen-plus}

spring:
  datasource:
    hikari:
      # 连接池上限必须结合数据库 max_connections、实例数和单请求耗时计算。
      maximum-pool-size: 10
      minimum-idle: 2
      # Hikari 的以下时间参数按毫秒绑定。
      connection-timeout: 3000
      validation-timeout: 1000
      idle-timeout: 600000
      max-lifetime: 1800000

resilience4j:
  circuitbreaker:
    instances:
      risk-service:
        sliding-window-size: 4
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
  ratelimiter:
    instances:
      chapter7-risk:
        limit-for-period: 2
        limit-refresh-period: 1s
        timeout-duration: 100ms
  retry:
    instances:
      risk-service:
        max-attempts: 3
        wait-duration: 100ms
