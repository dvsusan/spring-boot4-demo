spring:
  datasource:
    # 本地 Docker 默认连接；部署时通过 DB_URL、DB_USERNAME、DB_PASSWORD 覆盖。
    url: ${DB_URL:jdbc:postgresql://localhost:5432/spring_boot4}
    username: ${DB_USERNAME:spring_boot4}
    password: ${DB_PASSWORD:spring_boot4}
    hikari:
      # 连接池上限按教学环境设置，生产值必须经过压测。
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      # 生产结构只能由 Flyway 修改，Hibernate 只负责校验映射。
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

logging:
  level:
    org.hibernate.SQL: INFO
    org.mybatis: INFO
