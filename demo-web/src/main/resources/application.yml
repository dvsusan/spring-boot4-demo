spring:
  application:
    # 应用名会出现在日志、指标和监控数据中。
    name: demo-platform
  messages:
    # 参数校验消息统一从 classpath:messages*.properties 读取。
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  profiles:
    # 不指定启动参数时使用 dev 配置，方便本地学习。
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      # 文件章节限制单文件和整个请求大小，避免无界上传。
      max-file-size: 20MB
      max-request-size: 21MB
  datasource:
    # 默认使用 H2 保持前 14 篇教程无需外部数据库即可启动。
    url: jdbc:h2:mem:spring_boot4;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      # 默认 Profile 由 JPA 快速创建结构；db Profile 改用 Flyway。
      ddl-auto: create-drop
  flyway:
    # PostgreSQL 结构迁移只在 db Profile 开启。
    enabled: false
  data:
    redis:
      repositories:
        # 缓存章节使用 RedisTemplate，不需要扫描 Spring Data Redis Repository。
        enabled: false
    elasticsearch:
      repositories:
        # 搜索章节使用 ElasticsearchOperations，不自动扫描仓库。
        enabled: false

mybatis:
  configuration:
    # 数据库下划线列名自动映射为 Java 驼峰属性。
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mappers/*.xml

server:
  # 本地开发端口；启动时也可以用 --server.port 临时覆盖。
  port: 8080

demo:
  greeting:
    # 自定义 Starter 的配置项，关闭后 GreetingService 不会被创建。
    enabled: true
    message: "你好，%s，欢迎学习 Spring Boot 4"
  environment:
    # 该值会被 application-dev.yml 或 application-prod.yml 覆盖。
    label: local
    max-page-size: 100
    # 冒号后的 local 是环境变量缺失时的默认值。
    region: ${DEMO_REGION:local}
  order-client:
    # HTTP Interface 默认访问当前应用；部署后可切换到独立的订单服务地址。
    base-url: ${DEMO_ORDER_CLIENT_BASE_URL:http://localhost:${server.port:8080}}
    connect-timeout: 2s
    read-timeout: 3s
  chapter4:
    redis:
      # 每项外部能力默认关闭，前面的章节无需 Redis 即可启动。
      enabled: false
    redisson:
      enabled: false
    rocketmq:
      enabled: false
      consume: false
    jobs:
      enabled: false
    elasticsearch:
      enabled: false
  chapter5:
    minio:
      # MinIO 与 Excel 也按章节显式开启。
      enabled: false
    excel:
      enabled: false
  chapter6:
    # 默认关闭安全链，保证前五章接口仍可直接访问。
    enabled: false
    oauth2:
      enabled: false
    request-signing:
      enabled: true
    jwt:
      issuer: spring-boot4-demo
      access-ttl: 15m
    token:
      signing-key: ${DEMO_SIGNING_KEY:chapter6-demo-signing-key-change-before-production}
      web-secret: ${DEMO_REQUEST_SIGNING_SECRET:chapter6-request-signing-secret}
  chapter7:
    # 高级能力章节按需开启，避免本地缺少模型凭据时影响前六章。
    enabled: false
  chapter8:
    # 可观测性示例单独开启，避免日常开发被额外指标和追踪配置干扰。
    enabled: false

springdoc:
  api-docs:
    # OpenAPI 描述文件同时提供 JSON 和 YAML 后缀。
    path: /v3/api-docs
  swagger-ui:
    # 浏览器打开该路径即可查看并调用接口。
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        # 只开放健康检查和基础信息，避免把全部管理端点暴露出去。
        include: health,info

logging:
  level:
    # 打开项目包日志，便于观察 Bean 生命周期与请求链路。
    com.susan.training: INFO
