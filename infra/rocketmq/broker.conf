# 本地 Docker 教学配置；生产环境应根据磁盘、复制和网络拓扑重新规划。
brokerClusterName=DefaultCluster
brokerName=broker-a
brokerId=0
deleteWhen=04
fileReservedTime=48
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH
namesrvAddr=rocketmq-namesrv:9876
autoCreateTopicEnable=true
# 让宿主机上的 Java 应用可以通过 127.0.0.1:10911 访问 Broker。
brokerIP1=127.0.0.1
